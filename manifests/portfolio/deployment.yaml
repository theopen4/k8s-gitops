apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: portfolio
  labels:
    app: portfolio
    version: latest
spec:
  replicas: 1                         # 2 pods = haute disponibilité

  selector:
    matchLabels:
      app: portfolio

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                       # crée 1 nouveau pod avant d'en tuer un
      maxUnavailable: 0                 # jamais de downtime (0 pod tué avant qu'un nouveau soit prêt)

  template:
    metadata:
      labels:
        app: portfolio
      annotations:
        prometheus.io/scrape: "false"

    spec:
      # Secret pour puller l'image depuis ghcr.io
      # À créer manuellement (voir README)
      imagePullSecrets:
        - name: ghcr-secret

      # Répartir les pods sur des nœuds différents si possible
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: portfolio

      containers:
        - name: portfolio
          # ⚠ L'image et le tag sont gérés par kustomization.yaml
          image: ghcr.io/theopen4/portfolio-ezekiel:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          # Ressources adaptées à un site statique nginx
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          # Vérifier que le container est VIVANT
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3

          # Vérifier que le container est PRÊT à recevoir du trafic
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3

          # Arrêt propre : nginx se termine après avoir fini les requêtes en cours
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5 && nginx -s quit"]

      terminationGracePeriodSeconds: 30
