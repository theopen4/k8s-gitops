# Kustomize — point d'entrée lu par ArgoCD
# GitHub Actions modifie uniquement "newTag" pour changer la version d'image
#
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: portfolio

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# ── Gestion des versions d'image ─────────────────────────────────────
# GitHub Actions met à jour "newTag" automatiquement à chaque release.
# Ne pas modifier manuellement — laisser le pipeline CI le gérer.
images:
  - name: ghcr.io/theopen4/portfolio-ezekiel
    newTag: latest                      # ← mis à jour automatiquement par CI

# ── Labels ajoutés à toutes les ressources ───────────────────────────
commonLabels:
  app.kubernetes.io/managed-by: argocd
  app.kubernetes.io/part-of: ezekiel-portfolio
