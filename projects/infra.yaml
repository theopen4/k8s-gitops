# AppProject — Infrastructure (Image Updater, monitoring, cert-manager...)
# Accès plus large que web-apps : peut installer des ressources cluster-level.
#
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Infrastructure cluster — ArgoCD Image Updater, monitoring, cert-manager"

  sourceRepos:
    - 'https://github.com/theopen4/*'
    - 'https://argoproj.github.io/argo-helm'         # ArgoCD Image Updater Helm chart
    - 'https://charts.jetstack.io'                    # cert-manager
    - 'https://prometheus-community.github.io/helm-charts'  # kube-prometheus-stack

  destinations:
    - namespace: 'argocd'
      server: https://kubernetes.default.svc
    - namespace: 'cert-manager'
      server: https://kubernetes.default.svc
    - namespace: 'monitoring'
      server: https://kubernetes.default.svc
    - namespace: 'infra-*'
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding
    - group: 'apiextensions.k8s.io'
      kind: CustomResourceDefinition

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  orphanedResources:
    warn: true
