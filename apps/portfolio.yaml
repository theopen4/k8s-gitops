# ArgoCD Application — Portfolio Ezekiel Soh
# Ce fichier est détecté automatiquement par le root-app (apps/ directory).
#
# ArgoCD Image Updater surveille l'image et met à jour kustomization.yaml
# automatiquement via write-back git — plus besoin de job CI pour ça.
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/managed-by: argocd
    tier: web
    owner: ezekiel-soh
  annotations:
    # ── ArgoCD Image Updater ───────────────────────────────────────────
    argocd-image-updater.argoproj.io/image-list: ghcr.io/theopen4/portofolio-ezekiel
    argocd-image-updater.argoproj.io/update-strategy: newest-build
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-secret
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/allow-tags: regexp:^sha-[a-f0-9]{7}$
    argocd-image-updater.argoproj.io/write-back-target: kustomization:manifests/portfolio

spec:
  project: web-apps

  source:
    repoURL: https://github.com/theopen4/k8s-gitops.git
    targetRevision: HEAD
    path: manifests/portfolio

  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas      # ignore si HPA modifie les replicas
