# ArgoCD Image Updater — installé via Helm
# Surveille ghcr.io et met à jour les tags d'image automatiquement dans le repo gitops.
#
# Prérequis : créer le secret git avant de syncer cette app
#   kubectl create secret generic argocd-image-updater-secret \
#     --namespace argocd \
#     --from-literal=git.user=theopen4 \
#     --from-literal=git.password=<TON_GITHUB_PAT>
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: argocd-image-updater
    tier: infra
spec:
  project: infra

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: "~0.11.0"
    helm:
      values: |
        config:
          # Intervalle de polling du registry
          updateInterval: 2m
          # Log level : debug pour investiguer, info en prod
          logLevel: info
          # Credentials git pour le write-back
          gitCommitUser: "argocd-image-updater[bot]"
          gitCommitMail: "argocd-image-updater[bot]@users.noreply.github.com"

        authScripts:
          enabled: false

        serviceAccount:
          create: true
          name: argocd-image-updater

        rbac:
          enabled: true

        metrics:
          enabled: true
          serviceMonitor:
            enabled: false   # passer à true si kube-prometheus-stack est installé

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false   # argocd namespace existe déjà
  revisionHistoryLimit: 3
